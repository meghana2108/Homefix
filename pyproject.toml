[project]
name = "homefix"
version = "0.1.0"
description = "HomeFix: a fully local multimodal assistant (image, audio, text, code, video) for first-time renters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # models
    "ollama>=0.4",
    "mlx-whisper>=0.4.1",
    "transformers>=4.44",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    # text / retrieval / verification
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    # media
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "numpy>=1.26",
    # eval + diagnostics
    "jiwer>=3.0",
    "psutil>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a real model loaded (skipped by default; run with -m model)"]
addopts = "-m 'not model'"

[tool.ruff]
line-length = 100
target-version = "py311"
