# Deterministic pre-filter. Runs on every text message BEFORE any model.
# If any pattern matches (case-insensitive regex, word boundaries), the fixed message is returned verbatim.
patterns:
  gas:
    - '\b(smell|smells|smelling|odou?r)\b.{0,40}\bgas\b'
    - '\bgas\b.{0,40}\b(smell|leak|leaking|odou?r|hiss|hissing)\b'
    - '\brotten eggs?\b'
  sparks:
    - '\bspark(s|ing|ed)?\b'
    - '\barc(ing)?\b.{0,20}\b(outlet|plug|wire|socket)\b'
    - '\bshorting\b'
    - '\bshort(ed|s)?[- ]?(out|circuit\w*)\b'
    - '\bshorted\b'
  smoke_fire:
    - '\bsmok(e|ing|y)\b'
    - '\bburn(ing|t|ed)?\b.{0,20}\b(smell|plastic|rubber|odou?r)\b'
    - '\b(fire|flames?|on fire)\b'
    - '\bmelt(ed|ing)\b.{0,20}\b(plug|cord|outlet|wire)\b'
    - '\b(smell|smells|smelling|smelled|odou?r)\b.{0,20}\bburn(ing|t|ed)?\b'
    - '\b(device|outlet|socket|plug|cord|wire|wires|wiring|dryer|oven|stove|microwave|heater|fridge|washer|appliance|toaster|kettle|charger|it|something)\b.{0,15}\b(is|are|was|keeps?|started|been)\s+(burning|smoking)\b'
    - '\b(device|outlet|socket|plug|cord|wire|wires|wiring|charger)\b.{0,15}\bburn(t|ed)\b'
    - '\b(device|outlet|socket|plug|cord|wire|wires|wiring|charger|switch)\b.{0,20}\b(burn marks?|scorch\w*|discolou?red|blackened)\b'
    - '\b(burn marks?|scorch\w*|discolou?red|blackened)\b.{0,20}\b(outlet|socket|plug|cord|wire|wires|wiring|charger|switch)\b'
  exposed_wires:
    - '\b(exposed|bare|frayed|stripped)\s+(wire|wires|wiring|cable|cord)\b'
    - '\b(wire|wires|wiring|cable|cord)\b.{0,20}\b(exposed|bare|frayed|stripped)\b'
    - '\b(wire|wires|wiring|copper|metal)\b.{0,10}\b(showing|visible|sticking out|poking out|poking through|protruding)\b'
    - '\bshowing (copper|metal|wires?)\b'
    - '\bexposed (copper|metal)\b'
    - '\b(cord|cords|cable|cables)\b.{0,10}\bshowing through\b'
    - '\b(plug|cord|outlet)\b.{0,10}\bbare\b'
  water_electric:
    - '\bwater\b.{0,40}\b(outlet|socket|plug|electrical|breaker|panel)\b'
    - '\b(outlet|socket|plug|breaker|panel)\b.{0,40}\b(wet|water|flood|flooded|leak)\b'
  shock:
    - '\b(electric )?shock(ed)?\b'
message: >-
  ⚠️ This could be dangerous. Stop using the appliance now.
  If it's safe to do so, switch it off and unplug it (or turn off its breaker) — do not touch anything wet or sparking.
  If you smell gas: do not use switches, flames, or your phone indoors; leave the building and call your gas utility's emergency line or 911 from outside.
  If there is smoke or fire, leave and call 911.
  Then contact your landlord or a licensed professional. HomeFix won't give repair steps for this situation.
# One message per danger, so the first thing said fits it (gas: never touch a switch). Each starts with
# "⚠️ This could be dangerous. " (the UI card uses it as the title) and ends with the no-repair line.
# `message` above is the fallback for a category that has none here.
messages:
  gas: >-
    ⚠️ This could be dangerous. Don't touch any light switch, plug, flame or lighter, and don't use your phone inside.
    Leave the building now and get everyone out, leaving the door open behind you.
    From outside, call your gas utility's emergency line or 911. If anyone feels dizzy, sick or has a headache, call 911.
    Don't go back in until the gas company or fire department says it's safe.
    Then contact your landlord. HomeFix won't give repair steps for this situation.
  co: >-
    ⚠️ This could be dangerous. A carbon monoxide alarm means leave now: get everyone out, including pets, into fresh air.
    From outside, call 911 or the fire department. If anyone feels dizzy, sick or has a headache, tell them when you call.
    Don't go back in until the fire department says it's safe, even if the alarm stops.
    Then contact your landlord. HomeFix won't give repair steps for this situation.
  smoke_fire: >-
    ⚠️ This could be dangerous. If a smoke alarm is sounding or you see smoke or fire, get everyone out, don't go back in, and call 911 from outside.
    Don't try to put it out with water: water makes electrical and grease fires worse.
    If it's only a burning smell and it's safe to do so, turn off the appliance's breaker and don't use it again.
    Then contact your landlord or a licensed professional. HomeFix won't give repair steps for this situation.
  sparks: >-
    ⚠️ This could be dangerous. Don't touch the outlet, plug or appliance.
    If it's safe to do so, turn off its breaker at the panel. Don't use it again until it has been checked.
    If there is smoke or fire, leave and call 911.
    Then contact your landlord or a licensed electrician. HomeFix won't give repair steps for this situation.
  exposed_wires: >-
    ⚠️ This could be dangerous. Don't touch the wires or anything they touch.
    If it's safe to do so, turn off the breaker for that room at the panel. Keep children and pets away.
    If there is smoke or sparks, leave and call 911.
    Then contact your landlord or a licensed electrician. HomeFix won't give repair steps for this situation.
  water_electric: >-
    ⚠️ This could be dangerous. Don't touch the water or anything plugged in near it.
    Never touch a wet panel. If the breaker panel is dry and you can reach it without standing in water, turn off the breaker for that area.
    If the panel is wet or you can't reach it, stay out of the room. If there is smoke or sparks, leave and call 911.
    Then call your landlord's emergency line. HomeFix won't give repair steps for this situation.
  shock: >-
    ⚠️ This could be dangerous. Don't touch the appliance or outlet.
    If someone is still touching it, don't touch them: turn off the power at the breaker first, if it's safe.
    If someone is hurt, burned or feels unwell, call 911.
    Don't use it again until it has been checked. Then contact your landlord or a licensed electrician. HomeFix won't give repair steps for this situation.
# A sounding alarm is checked first, on the original text, so benign phrases can't hide it.
alarm_active:
  smoke_fire:
    - '\b(smoke|fire) (alarms?|detectors?)\b.{0,40}\b(going off|went off|goes off|go off|sounding|blaring|won''t stop|wont stop|beeping loudly|is loud)\b'
  co:
    - '\b(carbon monoxide|co) (alarms?|detectors?)\b.{0,40}\b(going off|went off|goes off|go off|sounding|blaring|won''t stop|wont stop|beeping)\b'
# Device names are replaced with " device " (not a blank) so "the smoke detector is burning" still matches.
device_names:
  - '\b(smoke|fire) (alarm|detector)s?\b'
# Harmless phrases that look like danger words. Each match is blanked out before the patterns above run.
# No gaps allowed: a gap could swallow a danger word.
benign:
  - '\bfire ?(tv|stick|tablet)\b'
  - '\bburn(t|ed|ing)? (toast|food|popcorn|rice)\b'
  - '\b(outlet|drain|inlet|fill) hose\b'
  - '\bgas (stove|range|oven) (recipe|cooking|temperature)\b'
  - '\bsparks? joy\b'
  - '\bburning (blue|evenly|normally|fine)\b'
  - '\bburn(s|ing)? through\b'
  - '\bcopper pipes?\b'
  - '\bwire (hangers?|shel(f|ves)|racks?|baskets?|brush(es)?|whisks?)\b'
  - '\b(metal|rust|primer|wood) (is |are )?showing through (the )?paint\b'
# What the vision model SAYS IT SEES in a photo (its description, reading or answer), checked with
# safety.check_observation(). Separate from `patterns` because a description isn't a person's words: a lit gas
# burner is "blue flames" and a stove ring "glows red", both normal, so flames and glowing are not here.
observed:
  smoke_fire:
    - '\b(burnt|charred|scorch\w*|singe\w*|soot\w*|blacken\w*)\b'
    - '\bburn(ed)? ?(marks?|spots?|damage|tip|edges?)\b'
    - '\bmelt(ed|ing)\b'
    - '\bsmok(e|ing)\b'
  sparks:
    - '\bspark(s|ing|ed)?\b'
  exposed_wires:
    - '\b(exposed|bare|frayed|stripped|loose)\b.{0,25}\b(wire|wires|wiring|copper|conductors?|cables?|cords?)\b'
    - '\b(wire|wires|wiring|cable|cord)\b.{0,25}\b(exposed|showing|frayed|sticking out|hanging out)\b'
  water_electric:
    - '\b(water|wet|leak\w*|drip\w*|pool\w*|flood\w*)\b.{0,40}\b(outlet|socket|panel|breaker|wiring|electrical|light fixture|switch)\b'
